environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  graphql: ^5.2.4
  graphql_flutter: ^5.3.0
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.4.14
  graphql_codegen: ^3.0.2
  json_serializable: ^6.9.0
  lints: ^6.0.0
