query GetBooks($name: String, $genre: String) {
  books(name: $name, genre: $genre) {
    id
    title
    author
    description
    synopsis
    rating
    genre
    pages
    publishYear
  }
}

query GetBookDetail($id: ID!) {
  book(id: $id) {
    id
    title
    author
    description
    synopsis
    rating
    genre
    pages
    publishYear
  }
}
