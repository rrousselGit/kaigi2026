# Builds the slides for the web and deploys them to GitHub Pages.
name: Deploy slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace requires a dev SDK, only available on master.
      - uses: subosito/flutter-action@v2
        with:
          channel: master

      - run: flutter pub get

      - name: Build slides
        working-directory: slides
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
          # Pages serves 404.html for unknown paths, so that /5 opens the
          # app on the fifth slide.
          cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
